<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h1 th:text="${paciente.id == null} ? 'Novo paciente' : 'Editar paciente'"></h1>

    <form th:action="@{/pacientes/salvar}" th:object="${paciente}" method="post" class="mt-3" style="max-width: 500px">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" th:field="*{nome}" class="form-control"
                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{nome}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">CPF</label>
            <input type="text" th:field="*{cpf}" class="form-control"
                   th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{cpf}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input type="text" th:field="*{telefone}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Data de nascimento</label>
            <input type="date" id="dataNascimento" th:field="*{dataNascimento}" class="form-control"
                   th:classappend="${#fields.hasErrors('dataNascimento')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{dataNascimento}"></div>
            <div class="form-text" id="idadeInfo"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Responsável <span class="text-muted">(obrigatório para menores de 18)</span></label>
            <input type="text" id="responsavel" th:field="*{responsavel}" class="form-control"
                   th:classappend="${#fields.hasErrors('responsavel')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{responsavel}"></div>
        </div>

        <div class="form-check mb-3">
            <input type="checkbox" th:field="*{ativo}" class="form-check-input" id="ativo">
            <label class="form-check-label" for="ativo">Ativo</label>
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="/pacientes" class="btn btn-secondary">Cancelar</a>
    </form>

    <!-- Preenchimento automático: mostra a idade ao escolher a data -->
    <script>
        const campo = document.getElementById('dataNascimento');
        const info = document.getElementById('idadeInfo');
        function calcularIdade() {
            if (!campo.value) { info.textContent = ''; return; }
            const nasc = new Date(campo.value);
            const hoje = new Date();
            let idade = hoje.getFullYear() - nasc.getFullYear();
            const m = hoje.getMonth() - nasc.getMonth();
            if (m < 0 || (m === 0 && hoje.getDate() < nasc.getDate())) idade--;
            info.textContent = 'Idade: ' + idade + ' anos' + (idade < 18 ? ' (menor: informe o responsável)' : '');
        }
        campo.addEventListener('change', calcularIdade);
        calcularIdade();
    </script>
</body>
</html>
