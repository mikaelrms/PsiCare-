<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pacientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Pacientes</h1>
        <div>
            <a href="/" class="btn btn-outline-secondary">Início</a>
            <a href="/pacientes/novo" class="btn btn-primary">Novo paciente</a>
        </div>
    </div>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th><th>Nome</th><th>CPF</th><th>Telefone</th>
                <th>Idade</th><th>Responsável</th><th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${pacientes}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.nome}"></td>
                <td th:text="${p.cpf}"></td>
                <td th:text="${p.telefone}"></td>
                <td>
                    <span th:text="${p.idade} + ' anos'"></span>
                    <span th:if="${p.menor}" class="badge bg-warning text-dark">Menor</span>
                </td>
                <td th:text="${p.responsavel}"></td>
                <td>
                    <a th:href="@{/pacientes/{id}/editar(id=${p.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <form th:action="@{/pacientes/{id}/excluir(id=${p.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Excluir este paciente?')">
                        <button class="btn btn-sm btn-danger">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pacientes)}">
                <td colspan="7" class="text-center text-muted">Nenhum paciente cadastrado.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
