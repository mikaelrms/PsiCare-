<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profissional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h1 th:text="${profissional.id == null} ? 'Novo profissional' : 'Editar profissional'"></h1>

    <form th:action="@{/profissionais/salvar}" th:object="${profissional}" method="post" class="mt-3" style="max-width: 500px">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" th:field="*{nome}" class="form-control"
                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{nome}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">CRP / matrícula</label>
            <input type="text" th:field="*{crp}" class="form-control"
                   th:classappend="${#fields.hasErrors('crp')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{crp}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo</label>
            <select th:field="*{tipo}" class="form-select"
                    th:classappend="${#fields.hasErrors('tipo')} ? 'is-invalid'">
                <option value="">Selecione...</option>
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{tipo}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Valor da sessão (R$)</label>
            <input type="number" step="0.01" th:field="*{valorSessao}" class="form-control"
                   th:classappend="${#fields.hasErrors('valorSessao')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{valorSessao}"></div>
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="/profissionais" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
