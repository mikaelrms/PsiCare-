<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profissionais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Profissionais</h1>
        <div>
            <a href="/" class="btn btn-outline-secondary">Início</a>
            <a href="/profissionais/novo" class="btn btn-primary">Novo profissional</a>
        </div>
    </div>

    <table class="table table-striped">
        <thead>
            <tr><th>ID</th><th>Nome</th><th>CRP</th><th>Tipo</th><th>Valor da sessão</th><th>Ações</th></tr>
        </thead>
        <tbody>
            <tr th:each="p : ${profissionais}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.nome}"></td>
                <td th:text="${p.crp}"></td>
                <td th:text="${p.tipo}"></td>
                <td th:text="${#numbers.formatDecimal(p.valorSessao, 1, 'POINT', 2, 'COMMA')}"></td>
                <td>
                    <a th:href="@{/profissionais/{id}/editar(id=${p.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <form th:action="@{/profissionais/{id}/excluir(id=${p.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Excluir este profissional?')">
                        <button class="btn btn-sm btn-danger">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(profissionais)}">
                <td colspan="6" class="text-center text-muted">Nenhum profissional cadastrado.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
