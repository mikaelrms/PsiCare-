<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sala</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h1 th:text="${sala.id == null} ? 'Nova sala' : 'Editar sala'"></h1>

    <form th:action="@{/salas/salvar}" th:object="${sala}" method="post" class="mt-3" style="max-width: 500px">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" th:field="*{nome}" class="form-control"
                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{nome}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Capacidade</label>
            <input type="number" th:field="*{capacidade}" class="form-control"
                   th:classappend="${#fields.hasErrors('capacidade')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{capacidade}"></div>
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="/salas" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
