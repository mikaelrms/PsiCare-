<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Salas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Salas</h1>
        <div>
            <a href="/" class="btn btn-outline-secondary">Início</a>
            <a href="/salas/nova" class="btn btn-primary">Nova sala</a>
        </div>
    </div>

    <table class="table table-striped">
        <thead>
            <tr><th>ID</th><th>Nome</th><th>Capacidade</th><th>Ações</th></tr>
        </thead>
        <tbody>
            <tr th:each="s : ${salas}">
                <td th:text="${s.id}"></td>
                <td th:text="${s.nome}"></td>
                <td th:text="${s.capacidade}"></td>
                <td>
                    <a th:href="@{/salas/{id}/editar(id=${s.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <form th:action="@{/salas/{id}/excluir(id=${s.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Excluir esta sala?')">
                        <button class="btn btn-sm btn-danger">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(salas)}">
                <td colspan="4" class="text-center text-muted">Nenhuma sala cadastrada.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
