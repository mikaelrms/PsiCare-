<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sessões</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Sessões</h1>
        <a href="/sessoes/nova" class="btn btn-primary">Nova sessão</a>
    </div>

    <table class="table table-striped align-middle">
        <thead>
            <tr>
                <th>Data/hora</th><th>Paciente</th><th>Profissional</th><th>Sala</th>
                <th>Duração</th><th>Valor</th><th>Status</th><th>Pago</th><th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="s : ${sessoes}">
                <td th:text="${#temporals.format(s.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${s.paciente.nome}"></td>
                <td th:text="${s.profissional.nome}"></td>
                <td th:text="${s.sala.nome}"></td>
                <td th:text="${s.duracaoMin} + ' min'"></td>
                <td th:text="${#numbers.formatDecimal(s.valor, 1, 'POINT', 2, 'COMMA')}"></td>
                <td>
                    <span class="badge"
                          th:text="${s.statusExibicao}"
                          th:classappend="${s.statusExibicao == 'REALIZADA'} ? 'bg-success' :
                                          (${s.statusExibicao == 'PENDENTE'} ? 'bg-warning text-dark' :
                                          (${s.statusExibicao == 'AGENDADA'} ? 'bg-primary' :
                                          (${s.statusExibicao == 'FALTA'} ? 'bg-danger' : 'bg-secondary')))"></span>
                </td>
                <td th:text="${s.pago} ? 'Sim' : 'Não'"></td>
                <td>
                    <a th:href="@{/sessoes/{id}/editar(id=${s.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <form th:action="@{/sessoes/{id}/excluir(id=${s.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Excluir esta sessão?')">
                        <button class="btn btn-sm btn-danger">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(sessoes)}">
                <td colspan="9" class="text-center text-muted">Nenhuma sessão cadastrada.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
